<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="judul-tentang">
  <title id="judul-tentang">Lesung batu berisi sambal dikelilingi cabai, bawang, tomat, dan jeruk nipis</title>
  <defs>
    <linearGradient id="tt-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf0dd"/>
      <stop offset="1" stop-color="#efdcc0"/>
    </linearGradient>
    <linearGradient id="tt-sambal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d94a37"/>
      <stop offset="1" stop-color="#77130f"/>
    </linearGradient>
    <linearGradient id="tt-stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b7165"/>
      <stop offset="1" stop-color="#514940"/>
    </linearGradient>
    <pattern id="tt-linen" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#f6ead6"/>
      <path d="M0 0h10M0 0v10" stroke="#e7d4b7" stroke-width="1" opacity=".7"/>
    </pattern>
    <pattern id="tt-weave" width="30" height="30" patternUnits="userSpaceOnUse" patternTransform="rotate(20)">
      <rect width="30" height="30" fill="#ddbb90"/>
      <rect width="15" height="30" fill="#d3af81"/>
      <path d="M0 0v30M15 0v30" stroke="#c29b6c" stroke-width="2" opacity=".45"/>
    </pattern>
    <filter id="tt-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#3a1c13" flood-opacity=".24"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#tt-bg)"/>
  <rect width="1200" height="900" fill="url(#tt-linen)" opacity=".55"/>
  <circle cx="1080" cy="120" r="190" fill="#e9b44c" opacity=".16"/>
  <circle cx="110" cy="780" r="210" fill="#b3261e" opacity=".07"/>

  <!-- Tikar bundar -->
  <circle cx="600" cy="460" r="376" fill="url(#tt-weave)"/>
  <circle cx="600" cy="460" r="376" fill="none" stroke="#b98e5e" stroke-width="5" opacity=".55"/>
  <circle cx="600" cy="460" r="344" fill="none" stroke="#c9a373" stroke-width="2" stroke-dasharray="7 10" opacity=".65"/>

  <!-- Mangkuk cabai merah kiri atas -->
  <g filter="url(#tt-shadow)">
    <circle cx="252" cy="196" r="118" fill="#fffaf0"/>
    <circle cx="252" cy="196" r="101" fill="#f1e0c7"/>
    <path d="M186 216c18-46 48-72 82-78-4 24-18 52-42 72-14 12-29 18-40 6Z" fill="#b3261e"/>
    <path d="M246 252c34-10 56-32 65-62 12 20 10 48-8 66-16 16-40 18-57-4Z" fill="#c73526"/>
    <path d="M214 252c2-30 16-56 40-70" fill="none" stroke="#7fa36a" stroke-width="7" stroke-linecap="round"/>
    <circle cx="252" cy="196" r="118" fill="none" stroke="#e2c8a5" stroke-width="4"/>
  </g>

  <!-- Mangkuk bawang putih kanan atas -->
  <g filter="url(#tt-shadow)">
    <circle cx="958" cy="204" r="116" fill="#fffaf0"/>
    <circle cx="958" cy="204" r="99" fill="#f1e0c7"/>
    <g fill="#f8ecd9" stroke="#dbc5a7" stroke-width="3">
      <path d="M902 200c0-26 18-44 42-44 25 0 43 18 43 44 0 28-18 48-43 48-24 0-42-20-42-48Z"/>
      <path d="M952 156c0-20 14-35 32-35 19 0 33 15 33 35 0 22-14 38-33 38-18 0-32-16-32-38Z"/>
      <path d="M976 232c0-18 13-32 30-32 18 0 31 14 31 32 0 20-13 34-31 34-17 0-30-14-30-34Z"/>
      <path d="M918 250c0-16 11-28 26-28 16 0 27 12 27 28 0 18-11 30-27 30-15 0-26-12-26-30Z"/>
    </g>
    <path d="M935 196c-4 9-4 20 0 29M984 158c-4 8-4 17 0 25M1005 240c-4 8-4 15 0 22" fill="none" stroke="#e1cdb2" stroke-width="3" stroke-linecap="round"/>
    <circle cx="958" cy="204" r="116" fill="none" stroke="#e2c8a5" stroke-width="4"/>
  </g>

  <!-- Mangkuk tomat kiri bawah -->
  <g filter="url(#tt-shadow)">
    <circle cx="198" cy="714" r="112" fill="#fffaf0"/>
    <circle cx="198" cy="714" r="96" fill="#f1e0c7"/>
    <circle cx="166" cy="698" r="37" fill="#c73b2c"/>
    <circle cx="216" cy="730" r="30" fill="#b93025"/>
    <circle cx="154" cy="748" r="24" fill="#d24a37"/>
    <path d="M166 668c9 5 14 11 15 19-7-2-14-1-19 3-3-8-3-15 4-22ZM216 706c7 4 11 9 12 15-6-2-11-1-15 2-3-6-2-12 3-17Z" fill="#3f5b43"/>
    <circle cx="198" cy="714" r="112" fill="none" stroke="#e2c8a5" stroke-width="4"/>
  </g>

  <!-- Mangkuk jeruk nipis kanan bawah -->
  <g filter="url(#tt-shadow)">
    <circle cx="1004" cy="712" r="110" fill="#fffaf0"/>
    <circle cx="1004" cy="712" r="94" fill="#f1e0c7"/>
    <g>
      <circle cx="972" cy="698" r="37" fill="#7fa36a"/>
      <circle cx="972" cy="698" r="29" fill="#d9e8b8"/>
      <g fill="none" stroke="#7fa36a" stroke-width="3">
        <path d="M972 672v52M946 698h52M954 680l36 36M990 680l-36 36"/>
      </g>
      <circle cx="1026" cy="740" r="31" fill="#6d9258"/>
      <circle cx="1026" cy="740" r="24" fill="#d9e8b8"/>
      <g fill="none" stroke="#6d9258" stroke-width="3">
        <path d="M1026 718v44M1004 740h44M1010 724l32 32M1042 724l-32 32"/>
      </g>
    </g>
    <path d="M1056 674c25-15 48-14 66 2-20 20-44 25-70 12Z" fill="#3f5b43"/>
    <circle cx="1004" cy="712" r="110" fill="none" stroke="#e2c8a5" stroke-width="4"/>
  </g>

  <!-- Lesung batu -->
  <g filter="url(#tt-shadow)">
    <circle cx="600" cy="462" r="196" fill="url(#tt-stone)"/>
    <circle cx="600" cy="462" r="166" fill="#463f37"/>
    <circle cx="600" cy="462" r="152" fill="#3b352e"/>
    <circle cx="600" cy="462" r="136" fill="url(#tt-sambal)"/>
    <g fill="#d94a37" opacity=".65">
      <circle cx="540" cy="412" r="9"/><circle cx="646" cy="398" r="6"/>
      <circle cx="686" cy="470" r="8"/><circle cx="560" cy="520" r="6"/>
      <circle cx="632" cy="542" r="5"/><circle cx="598" cy="450" r="4"/>
      <circle cx="512" cy="474" r="4"/><circle cx="664" cy="520" r="3"/>
    </g>
    <!-- Daun jeruk dan irisan cabai di atas sambal -->
    <path d="M642 388c28-16 56-14 76 4-24 22-52 26-82 10Z" fill="#3f5b43" opacity=".9"/>
    <path d="M512 506c26-10 50-7 68 10-22 18-48 19-74 4Z" fill="#3f5b43" opacity=".8"/>
    <path d="M578 378c20 6 38 2 52-12" fill="none" stroke="#f0a38f" stroke-width="4" stroke-linecap="round" opacity=".7"/>
    <circle cx="600" cy="462" r="196" fill="none" stroke="#8d8172" stroke-width="5"/>
  </g>

  <!-- Ulekan kayu -->
  <g filter="url(#tt-shadow)" transform="rotate(38 708 310)">
    <rect x="684" y="112" width="48" height="344" rx="24" fill="#9a846a"/>
    <rect x="694" y="136" width="11" height="270" rx="5" fill="#c7b296" opacity=".7"/>
    <ellipse cx="708" cy="452" rx="34" ry="22" fill="#7c6750"/>
  </g>

  <!-- Bawang goreng di mangkuk kecil tengah atas -->
  <g filter="url(#tt-shadow)">
    <circle cx="600" cy="104" r="62" fill="#fffaf0"/>
    <circle cx="600" cy="104" r="50" fill="#e9d3ae"/>
    <g fill="#cf9a45">
      <ellipse cx="584" cy="94" rx="10" ry="6" transform="rotate(-20 584 94)"/>
      <ellipse cx="608" cy="110" rx="10" ry="6" transform="rotate(15 608 110)"/>
      <ellipse cx="616" cy="88" rx="9" ry="5" transform="rotate(-10 616 88)"/>
      <ellipse cx="590" cy="118" rx="9" ry="5" transform="rotate(30 590 118)"/>
      <ellipse cx="602" cy="98" rx="8" ry="5" transform="rotate(60 602 98)"/>
    </g>
  </g>

  <!-- Sendok kayu -->
  <g filter="url(#tt-shadow)" transform="rotate(-22 520 760)">
    <rect x="500" y="686" width="26" height="190" rx="13" fill="#a8845e"/>
    <ellipse cx="513" cy="670" rx="44" ry="60" fill="#b99267"/>
    <ellipse cx="513" cy="670" rx="29" ry="42" fill="#967048"/>
  </g>

  <!-- Cabai & daun yang berserakan -->
  <g transform="translate(340 272) rotate(20)">
    <path d="M8 30c33 6 60-4 79-28 5-6 12-5 14 2 3 9-12 25-28 35-17 11-41 14-60 9-6-2-10-9-5-18Z" fill="#b3261e"/>
    <path d="M91 0c6-6 15-6 21 0s6 15 0 21" fill="none" stroke="#3f5b43" stroke-width="7" stroke-linecap="round"/>
  </g>
  <g transform="translate(838 330) rotate(-15)">
    <path d="M8 30c33 6 60-4 79-28 5-6 12-5 14 2 3 9-12 25-28 35-17 11-41 14-60 9-6-2-10-9-5-18Z" fill="#9d2019"/>
    <path d="M91 0c6-6 15-6 21 0s6 15 0 21" fill="none" stroke="#3f5b43" stroke-width="7" stroke-linecap="round"/>
  </g>
  <g transform="translate(760 826) rotate(-8)">
    <path d="M0 34C36 6 86-2 128 10c-30 30-74 44-128 24Z" fill="#3f5b43"/>
    <path d="M14 30c28-12 56-14 82-6" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g transform="translate(318 824) rotate(156)">
    <path d="M0 34C36 6 86-2 128 10c-30 30-74 44-128 24Z" fill="#4c6b3c"/>
  </g>
</svg>
