    <text x="602" y="496" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" fill="#2b1a16">Sambal</text>
    <text x="602" y="530" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" fill="#2b1a16">Bawang</text>
    <line x1="536" y1="548" x2="668" y2="548" stroke="#b3261e" stroke-width="1.5" opacity=".45"/>
    <text x="602" y="570" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="2.5" fill="#7a665b">PEDAS 3/5 &#183; 180 G</text>
    <path d="M736 402c20-8 38 2 42 20 3 16-8 32-24 35" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="10" stroke-linecap="round"/>
