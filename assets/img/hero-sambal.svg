    <path d="M252 644h154v84c0 20-16 36-36 36h-82c-20 0-36-16-36-36Z" fill="url(#hero-ijo)"/>
    <rect x="252" y="554" width="28" height="140" rx="14" fill="#ffffff" opacity=".4"/>
    <rect x="224" y="508" width="210" height="64" rx="20" fill="#4b2e22"/>
    <rect x="240" y="520" width="178" height="10" rx="5" fill="#ffffff" opacity=".14"/>
    <rect x="266" y="626" width="126" height="114" rx="10" fill="#fffaf0" stroke="#5b7b3c" stroke-opacity=".3" stroke-width="2"/>
    <text x="329" y="650" text-anchor="middle" font-family="Georgia, serif" font-size="11" letter-spacing="3" fill="#335024">SAMBALAKU</text>
    <text x="329" y="676" text-anchor="middle" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#2b1a16">Sambal Ijo</text>
    <text x="329" y="700" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" letter-spacing="1.5" fill="#7a665b">PEDAS 3/5</text>
