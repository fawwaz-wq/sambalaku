    <path d="M0 58C36 30 86 22 128 34c-30 30-74 44-128 24Z" opacity=".8"/>
    <path d="M18 24c30-12 60-14 84-4" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="3" stroke-linecap="round"/>
