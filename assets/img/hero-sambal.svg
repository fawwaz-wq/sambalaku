    <path d="M860 654h150v76c0 19-15 34-34 34h-82c-19 0-34-15-34-34Z" fill="url(#hero-terasi)"/>
    <rect x="860" y="566" width="26" height="132" rx="13" fill="#ffffff" opacity=".4"/>
    <rect x="832" y="516" width="206" height="62" rx="20" fill="#4b2e22"/>
    <rect x="848" y="528" width="174" height="10" rx="5" fill="#ffffff" opacity=".14"/>
    <rect x="872" y="630" width="126" height="112" rx="10" fill="#fffaf0" stroke="#8e3b22" stroke-opacity=".3" stroke-width="2"/>
    <text x="935" y="654" text-anchor="middle" font-family="Georgia, serif" font-size="11" letter-spacing="3" fill="#582011">SAMBALAKU</text>
    <text x="935" y="680" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#2b1a16">Terasi Bakar</text>
    <text x="935" y="703" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" letter-spacing="1.5" fill="#7a665b">PEDAS 4/5</text>
