    <path d="M704 890c-3-19 11-36 30-38 20-2 37 12 39 31 2 21-14 38-34 39-17 1-32-12-35-32Z" fill="#f4e5d0"/>
    <path d="M720 892c-1-12 8-23 19-24 12-1 22 8 23 20 1 13-9 24-21 25-10 1-19-8-21-21Z" fill="#fffaf1"/>
