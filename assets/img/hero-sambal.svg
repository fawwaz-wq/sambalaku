    <text x="1006" y="158" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#fff8ec">100%</text>
    <text x="1006" y="180" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#f8e8cf">CABAI ASLI</text>
    <text x="1006" y="199" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="1.5" fill="#f3d9b8">TANPA PENGAWET</text>
