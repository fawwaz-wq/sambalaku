<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" role="img" aria-labelledby="judul-hero">
  <title id="judul-hero">Tiga toples sambal Sambalaku dengan cabai, bawang, dan tomat di atas meja kayu</title>
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf1"/>
      <stop offset="1" stop-color="#f2ddc0"/>
    </linearGradient>
    <linearGradient id="hero-jar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#efe0ca"/>
    </linearGradient>
    <linearGradient id="hero-isi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d94a37"/>
      <stop offset="1" stop-color="#77130f"/>
    </linearGradient>
    <linearGradient id="hero-ijo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8aa85f"/>
      <stop offset="1" stop-color="#335024"/>
    </linearGradient>
    <linearGradient id="hero-terasi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9653f"/>
      <stop offset="1" stop-color="#582011"/>
    </linearGradient>
    <filter id="hero-shadow" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#3a1c13" flood-opacity=".24"/>
    </filter>
    <pattern id="hero-weave" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(24)">
      <rect width="34" height="34" fill="#e2c39a"/>
      <rect width="17" height="34" fill="#d9b78c"/>
      <path d="M0 0v34M17 0v34" stroke="#c9a476" stroke-width="2" opacity=".5"/>
    </pattern>
  </defs>

  <rect width="1200" height="1000" fill="url(#hero-bg)"/>
  <circle cx="1004" cy="186" r="244" fill="#b3261e" opacity=".07"/>
  <circle cx="138" cy="264" r="164" fill="#e9b44c" opacity=".2"/>

  <!-- Lengkungan latar -->
  <path d="M296 748V382c0-166 136-302 304-302s304 136 304 302v366Z" fill="#f7e5c9" opacity=".75"/>

  <!-- Daun gantung -->
  <g fill="#3f5b43">
    <path d="M126 0c34 66 38 130 22 194-50-58-58-128-22-194Z" opacity=".9"/>
    <path d="M126 44c48 16 82 50 102 98-62 6-103-20-122-80Z" opacity=".7"/>
    <path d="M1064 0c-34 66-38 130-22 194 50-58 58-128 22-194Z" opacity=".82"/>
    <path d="M1064 44c-48 16-82 50-102 98 62 6 103-20 122-80Z" opacity=".62"/>
  </g>

